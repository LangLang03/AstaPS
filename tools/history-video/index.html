<script>

// ---------- palette ----------

// ---------- data ----------
const D = window.DATA;

const NC = COMMITS.length;
const T0 = COMMITS[0].t, T1 = COMMITS[NC - 1].t;
const dayOf = t => Math.floor((t + TZ) / 86400);
const DAY0 = dayOf(T0), DAYN = dayOf(T1);
function dateStr(t) { const d = new Date((t + TZ) * 1000); return `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}-${String(d.getUTCDate()).padStart(2, '0')}`; }

// subtree birth & alive counts over commits
NODES.forEach(n => { n.birth = Infinity; n.aliveAt = []; });

// alive per subtree after each commit (for widths), computed incrementally
{

    for (const [id, k] of c.f) {

const CAM = [];
{

const AUTHORS = [...new Set(COMMITS.map(c => c.a))];

      ctx.font = '700 24px Serif'; ctx.fillStyle = INK; ctx.textAlign = 'right'; ctx.fillText(String(n), sx + 330, y); ctx.textAlign = 'left';
      const bw = 300 * nn / max;
      if (bw > 4) brushLine(ctx, sx, y + 14, sx + bw, y + 14, 9, col, 0.85, 200 + hashStr(a) % 1000, true, { bristles: 4, dry: 0.45 });
      y += 58;
    });
    ctx.globalAlpha = 1;
  }
  // legend
  if (hudA > 0) {
    ctx.globalAlpha = hudA * 0.9;
    let lx = 1545, ly = 856;
    ctx.font = '24px Brush'; ctx.fillStyle = '#4a4038'; ctx.fillText('花色 · 文件类型', lx, ly - 8);
    TYPES.slice(0, 8).forEach((t, i) => {
      const x = lx + (i % 2) * 175, y = ly + 24 + Math.floor(i / 2) * 29;
      ctx.drawImage(SPRITES[i][0], x - 4, y - 18, 26, 26);
      ctx.font = '20px Brush'; ctx.fillStyle = '#3a332b'; ctx.fillText(t.label, x + 26, y + 2);
    });
    ctx.globalAlpha = 1;
  }
  drawTimeline(p, rt, ci, hudA);
  drawLog(p, ci, hudA);
}

const TL = { x0: 90, x1: 1830, y: 1022 };
function drawTimeline(p, rt, ci, hudA) {
  if (hudA <= 0) return;
  ctx.globalAlpha = hudA;
  const X = t => lerp(TL.x0, TL.x1, (t - (DAY0 * 86400 - TZ)) / ((DAYN + 1) * 86400 - DAY0 * 86400));
  // base stroke
  brushLine(ctx, TL.x0 - 10, TL.y, TL.x1 + 10, TL.y, 3, INK, 0.35, 501, false, { bristles: 0 });
  // day ticks
  for (let d = DAY0; d <= DAYN + 1; d++) {
    const x = X(d * 86400 - TZ);
    ctx.strokeStyle = rgba(INK, 0.4); ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(x, TL.y - 6); ctx.lineTo(x, TL.y + 6); ctx.stroke();
    if (d <= DAYN) {
      const md = dateStr(d * 86400 - TZ).slice(5).replace('-', '/');
      ctx.font = '17px Mono'; ctx.fillStyle = d - DAY0 === dayOf(rt) - DAY0 ? SEAL : 'rgba(60,50,40,0.6)';
      ctx.textAlign = 'center'; ctx.fillText(md, x + (X(86400) - X(0)) / 2, TL.y + 34); ctx.textAlign = 'left';
    }
  }
  // commit dots
  for (let i = 0; i <= ci; i++) {
    const c = COMMITS[i]; const x = X(c.t); const pop = ease((p - c.p) / 0.3);
    const col = AUTHOR_INK[c.a] || INK;
    const sz = c.merge ? 6 : 4 + Math.min(12, Math.log2(1 + c.f.length) * 1.2);
    ctx.fillStyle = col; ctx.globalAlpha = hudA * 0.75 * pop;
    ctx.beginPath(); ctx.arc(x, TL.y - 16 - (h1(i) * 9), sz * 0.45, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = hudA;
  // progress stroke
  const xe = X(rt);
  if (xe > TL.x0 + 3) brushLine(ctx, TL.x0, TL.y, xe, TL.y, 9, INK, 0.88, 502, false, { bristles: 5, dry: 0.3 });
  // brush tip marker
  ctx.fillStyle = SEAL; ctx.beginPath(); ctx.arc(xe, TL.y, 7, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
}

function wrapLines(text, maxW, maxLines) {
  const words = text.split(' '); const out = []; let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width <= maxW) cur = t;
    else { if (cur) out.push(cur); cur = w; while (ctx.measureText(cur).width > maxW && cur.length > 3) cur = cur.slice(0, -1); }
    if (out.length === maxLines) break;
  }
  if (out.length < maxLines && cur) out.push(cur);
  if (out.length === maxLines && out.join(' ').length < text.length) { let l = out[maxLines - 1]; while (ctx.measureText(l + '…').width > maxW && l.length > 1) l = l.slice(0, -1); out[maxLines - 1] = l + '…'; }
  return out;
}
function drawLog(p, ci, hudA) {
  if (hudA <= 0) return;
  const x = 70; let y = 418;
  ctx.globalAlpha = hudA;
  ctx.font = '32px Brush'; ctx.fillStyle = INK; ctx.fillText('落笔记录', x, y);
  brushLine(ctx, x, y + 16, x + 150, y + 16, 4, SEAL, 0.8, 98, true, { bristles: 3 });
  if (ci < 0) { ctx.globalAlpha = 1; return; }
  const newest = COMMITS[ci]; const slide = 1 - easeOut((p - newest.p) / 0.45);
  y = 470 - slide * 96;
  ctx.save(); ctx.beginPath(); ctx.rect(0, 444, 520, 520); ctx.clip();
  for (let k = 0; k < 6; k++) {
    const i = ci - k; if (i < 0) break;
    const c = COMMITS[i];
    let a = hudA * (k === 0 ? ease((p - c.p) / 0.35) : 1) * Math.max(0, 1 - k * 0.2);
    if (y > 930) a *= Math.max(0, 1 - (y - 930) / 40);
    if (a <= 0.01) { y += 96; continue; }
    ctx.globalAlpha = a;
    ctx.font = '15px Mono'; ctx.fillStyle = '#8a7d70'; ctx.fillText(c.h, x, y);
    ctx.font = '24px Brush'; ctx.fillStyle = AUTHOR_INK[c.a] || INK; ctx.fillText(c.a, x + 80, y + 1);
    const aw = ctx.measureText(c.a).width;
    ctx.font = '15px Mono'; ctx.fillStyle = '#8a7d70';
    const meta = c.merge ? 'merge' : `${c.f.length} 文件  +${fmt(c.added)} −${fmt(c.deleted)}`;
    ctx.font = '15px Mono'; ctx.fillText(meta, x + 92 + aw, y);
    ctx.font = '700 20px Serif'; ctx.fillStyle = INK;
    let ls = wrapLines(c.s, 380, 2);
    if (k === 0) { const tot = ls.join('').length; let budget = Math.ceil(tot * ease((p - c.p) / 0.6)); ls = ls.map(l => { const r = l.slice(0, Math.max(0, budget)); budget -= l.length; return r; }); }
    ls.forEach((l, j) => ctx.fillText(l, x, y + 28 + j * 24));
    y += 96;
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

// ---------- intro / outro overlays ----------
function drawIntro(p) {
  if (p > INTRO + 0.8) return;
  const a = 1 - ease((p - INTRO + 0.4) / 1.2);
  if (a <= 0) return;
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  revealText('', 0, 0, '10px Brush', INK, 0);
  ctx.font = '40px Brush'; ctx.fillStyle = '#4a4038';
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W * ease((p - 0.3) / 1.5), H); ctx.clip();
  ctx.fillText('从第 0 天，到今天', (VIEW.x0 + VIEW.x1) / 2, 560);
  ctx.font = '26px SerifI'; ctx.fillStyle = '#6a5d50';
  ctx.fillText(`${dateStr(T0)}  —  ${dateStr(T1)}  ·  ${NC} commits`, (VIEW.x0 + VIEW.x1) / 2, 606);
  ctx.restore();
  ctx.textAlign = 'left'; ctx.globalAlpha = 1;
}

function drawOutro(p) {
  const t0 = INTRO + MAIN; const u = (p - t0); if (u < 0) return;
  const a = ease(u / 1.6);
  // wash
  ctx.fillStyle = rgba(PAPER, 0.72 * a); ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = a; ctx.textAlign = 'center';
  const cx = W / 2 - 40;
  revealText('', 0, 0, '10px Brush', INK, 0);
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, cx - 400 + 900 * ease(u / 1.8), H); ctx.clip();
  ctx.font = '120px Brush'; ctx.fillStyle = INK; ctx.fillText('十七日 · 一树繁花', cx, 440);
  ctx.restore();
  const b = ease((u - 1.4) / 1.2); ctx.globalAlpha = b;
  const last = COMMITS[NC - 1];
  ctx.font = '46px Brush'; ctx.fillStyle = '#3a332b';
  ctx.fillText(`${NC} 次提交  ·  ${AUTHORS.length} 位执笔者  ·  ${fmt(last.alive[ROOT.id])} 个文件  ·  ${fmt(last.lines)} 行`, cx, 530);
  ctx.font = '30px SerifI'; ctx.fillStyle = '#6a5d50';
  ctx.fillText(`Day 0 (${dateStr(T0)})  →  Day ${DAYN - DAY0} (${dateStr(T1)})`, cx, 585);
  const c = ease((u - 2.6) / 1.0); ctx.globalAlpha = c;
  ctx.font = '26px Brush'; ctx.fillStyle = '#4a4038';
  ctx.fillText('每一帧皆由 JavaScript 逐笔绘制于 Canvas', cx, 660);
  ctx.textAlign = 'left'; ctx.globalAlpha = 1;
  // seal slam
  const sv = (u - 3.2); if (sv > 0) { const s = 1 + 0.5 * (1 - easeOut(sv / 0.25)); drawSeal(cx + 540, 392, 96 * s, '源流年轮', ease(sv / 0.15) * 0.95, 9); }
}

// ---------- main render ----------
function renderFrame(f) {
  const p = f / FPS;
  cam = CAM[Math.min(f, CAM.length - 1)];
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(PAPER_LAYER, 0, 0);
  ctx.globalCompositeOperation = 'multiply';
  drawGround(p);
  drawTrunk(p);
  drawBranches(p);
  const flashes = [];
  drawFiles(p, flashes);
  drawCommitStrokes(p);
  drawFlashes(flashes);
  ctx.globalCompositeOperation = 'source-over';
  drawAuthors(p);
  drawHUD(p, f);
  drawIntro(p);
  drawOutro(p);
}
window.NFRAMES = NFRAMES; window.FPS = FPS; window.renderFrame = renderFrame;
window.READY = Promise.all(['108px Brush', '700 30px Serif', '22px SerifI', '16px Mono'].map(f => document.fonts.load(f, 'AstaPS 第天0'))).then(() => document.fonts.ready).then(() => { renderFrame(0); return true; });
</script></body></html>
